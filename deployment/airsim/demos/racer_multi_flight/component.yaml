  short_case_evidence: deployment/airsim/demos/racer_multi_flight/forest-short-validation.json
  evidence: deployment/airsim/demos/racer_multi_flight/validation.md
  limitations: [bounded-two-UAV-PC-only, no-full-coverage, no-flight-collision-event-statistics, no-RoboPi, R2-R5-recovery-tested, no-hot-rollback-test, R5-Drone1-diagnostic-readback-incomplete, historical-input-exit-unresolved]
